name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax check shell scripts
        run: |
          set -euo pipefail
          bash -n install.sh
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find assets -type f -name '*.sh' -print0)
          sh -n assets/openwrt/99-macvlan-bridge
          sh -n assets/openwrt/macvlan-bridge.init
          sh -n assets/macmini/surge-ipv6-router

      - name: ShellCheck (errors only)
        run: |
          set -euo pipefail
          mapfile -d '' bash_scripts < <(find assets -type f -name '*.sh' -print0)
          shellcheck -S error -s bash install.sh "${bash_scripts[@]}"
          shellcheck -S error -s sh \
            assets/openwrt/99-macvlan-bridge \
            assets/openwrt/macvlan-bridge.init \
            assets/macmini/surge-ipv6-router

      - name: Compile check Python files
        run: |
          set -euo pipefail
          mapfile -d '' py_files < <(find assets tests -type f -name '*.py' -print0)
          python3 -m py_compile "${py_files[@]}"

      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          unset MOSDNS_TEST_BINARY
          python3 -m unittest discover -s tests -v
