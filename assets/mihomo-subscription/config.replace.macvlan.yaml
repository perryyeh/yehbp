# Overlay applied to a downloaded full Mihomo configuration subscription.
# This deliberately contains only deployment-local values. The updater recursively
# merges it into the subscription; dns.fake-ip-range6 is replaced only when the
# upstream configuration already defines that key.
secret: 'admin' # CHANGE-ME: api访问密码
bind-address: "*"
allow-lan: true
ipv6: true
mode: rule
unified-delay: true
mixed-port: 7890 # HTTP(S) 和 SOCKS5 代理混合端口
profile:
  store-selected: true
  store-fake-ip: true
external-controller: :9090
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.tar.gz"
tun:
  enable: true
  stack: gVisor
  udp-timeout: 300
  auto-route: true
  auto-redirect: false
  auto-detect-interface: true
dns:
  enable: true
  listen: :53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-range6: 2001:2:0:6152:0:9::/96
  respect-rules: true
