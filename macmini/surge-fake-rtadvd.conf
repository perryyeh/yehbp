# Reference template only. surge-ipv6-router generates and overwrites the
# live copy at /usr/local/etc/surge-fake-rtadvd.conf with the selected LAN
# interface substituted for <LAN_INTERFACE>.
#
# This RA has router lifetime 0: it does not become the LAN default router.
# It publishes only an RFC 4191 Route Information Option (RIO) for Surge Fake
# IPv6. The 2001:db8 prefix is a non-SLAAC dummy PIO required by this rtadvd
# configuration shape.
<LAN_INTERFACE>:\
  :rltime#0:mininterval#3:maxinterval#10:\
    :addr="2001:db8:6152::":prefixlen#64:pinfoflags#0:vltime#0:pltime#0:\
  :rtprefix="2001:2:0:6152::":rtplen#64:rtflags="":rtltime#180:
